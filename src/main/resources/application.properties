spring.application.name=stockflow-backend
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/stockflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:stockuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:stockpass}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

