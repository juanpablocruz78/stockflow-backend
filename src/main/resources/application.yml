# --- CONFIGURACIÓN COMÚN (Para ambos entornos) ---
spring:
  profiles:
    active: dev
  application:
    name: stockflow
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:29C2B0CCA972A0911F43DD4E8FFB97A00A9CEB7F3897538DE0BF61CBED3DC76D}
    refresh-expiration: 604800000

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

---
# --- PERFIL: DEVELOPMENT (Para tu PC local) ---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/stockflow
    username: postgres
    password: password123
  jpa:
    show-sql: true

---
# --- PERFIL: DOCKER (Para el despliegue) ---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:stockflow}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password123}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false